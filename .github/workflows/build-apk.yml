name: Build Purohit Seva APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -q purohit-seva-mobile-apk-pack.zip -d pack
          unzip -q pack/purohit-seva-android-project.zip

      - name: Build Android APK
        working-directory: purohit-seva-android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: purohit-seva-debug-apk
          path: purohit-seva-android/app/build/outputs/apk/debug/app-debug.apk
