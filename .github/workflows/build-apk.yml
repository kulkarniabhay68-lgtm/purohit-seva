name: Build Purohit Seva APK V10 Notification Fixed

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q purohit-seva-mobile-apk-pack-v10-notification-fixed.zip -d pack
          unzip -q pack/purohit-seva-android-project.zip

      - name: Fix Android Gradle Plugin and compileSdk
        working-directory: purohit-seva-android
        run: |
          sed -i "s/id 'com.android.application' version '8.6.1'/id 'com.android.application' version '8.10.0'/" build.gradle
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle

      - name: Enable AndroidX
        working-directory: purohit-seva-android
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Android APK
        working-directory: purohit-seva-android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: purohit-seva-v10-notification-fixed-debug-apk
          path: purohit-seva-android/app/build/outputs/apk/debug/app-debug.apk
